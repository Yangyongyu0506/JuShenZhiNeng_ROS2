launch:
  - node:
      pkg: control_py
      exec: track_line
      name: track_line_node
      output: screen
  - node:
      pkg: hardware_interface_py
      exec: i2c
      name: i2c_node
      output: screen
  - node:
      pkg: hardware_interface_py
      exec: usb_camera
      name: usb_camera_node
      output: screen
      param:
        - name: video_id
          value: 1