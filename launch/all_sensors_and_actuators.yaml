launch:
  - node:
      pkg: "sensor"
      exec: "integrated_sensors"
      name: "integrated_sensors"
      output: "screen"

  - node:
      pkg: "actuator"
      exec: "servo"
      name: "servo"
      output: "screen"

  - node:
      pkg: "actuator"
      exec: "wheel"
      name: "wheel"
      output: "screen"